services:
  migration-test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: elevra_migration_test
      POSTGRES_USER: elevra_test
      POSTGRES_PASSWORD: ${ELEVRA_MIGRATION_TEST_PASSWORD:?Set a test-only password before starting this disposable database}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevra_test -d elevra_migration_test"]
      interval: 2s
      timeout: 3s
      retries: 30

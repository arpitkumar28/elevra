services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: elevra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elevra}
      POSTGRES_USER: ${POSTGRES_USER:-elevra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elevra_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: elevra-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

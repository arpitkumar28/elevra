name: Deploy database migrations

on:
  push:
    branches: [develop, main, codex/website-design-transformation]
    paths:
      - services/backend/alembic/**
      - services/backend/app/models/**
      - services/backend/requirements.txt
      - .github/workflows/deploy-migrations.yml
  workflow_dispatch:
    inputs:
      migration_history_reviewed:
        description: Confirm the migration history correction passed a fresh PostgreSQL upgrade test and review
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  migrate-staging:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' && inputs.migration_history_reviewed == true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/backend/requirements.txt
      - run: alembic upgrade head
        working-directory: services/backend
        env:
          ENVIRONMENT: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALEMBIC_DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-production:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/website-design-transformation') && github.event_name == 'workflow_dispatch' && inputs.migration_history_reviewed == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/backend/requirements.txt
      - name: Validate production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: vrwblsjfqsdhjsayxxvw
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          database_url = os.environ.get("DATABASE_URL", "").strip()
          if not database_url:
              raise SystemExit(
                  "::error::The production environment secret DATABASE_URL is empty or unavailable. "
                  "Set it under Settings > Environments > production > Environment secrets."
              )

          try:
              parsed = make_url(database_url)
          except Exception:
              raise SystemExit(
                  "::error::The production DATABASE_URL is not a valid SQLAlchemy database URL."
              ) from None

          expected_ref = os.environ["EXPECTED_SUPABASE_PROJECT_REF"]
          if not parsed.host or expected_ref not in database_url:
              raise SystemExit(
                  "::error::The production DATABASE_URL does not identify the configured Elevra Supabase project. "
                  "Check the production secret without pasting it into logs or chat."
              )

          print(f"Validated production database URL for Supabase project {expected_ref} (host: {parsed.host}).")
          PY
      - run: alembic upgrade head
        working-directory: services/backend
        env:
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALEMBIC_DATABASE_URL: ${{ secrets.DATABASE_URL }}

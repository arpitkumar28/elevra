name: Deploy database migrations

on:
  push:
    branches: [develop, main]
    paths:
      - services/backend/alembic/**
      - services/backend/app/models/**
      - services/backend/requirements.txt
      - .github/workflows/deploy-migrations.yml
  workflow_dispatch:
    inputs:
      migration_history_reviewed:
        description: Confirm the migration history correction passed a fresh PostgreSQL upgrade test and review
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  migrate-staging:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' && inputs.migration_history_reviewed == true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/backend/requirements.txt
      - run: alembic upgrade head
        working-directory: services/backend
        env:
          ENVIRONMENT: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALEMBIC_DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.migration_history_reviewed == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/backend/requirements.txt
      - run: alembic upgrade head
        working-directory: services/backend
        env:
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALEMBIC_DATABASE_URL: ${{ secrets.DATABASE_URL }}

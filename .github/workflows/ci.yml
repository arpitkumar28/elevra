name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: elevra_migration_test
          POSTGRES_USER: elevra_test
          POSTGRES_PASSWORD: ci-only-migration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elevra_test -d elevra_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/backend/requirements.txt
      - run: pip check
      - run: pytest -q services/backend/tests -m "not integration"
        env:
          USE_SQLITE_FOR_TESTS: 'true'
      - run: pytest -q services/backend/tests/test_migrations_postgres.py -m integration
        env:
          ELEVRA_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://elevra_test:ci-only-migration-test-password@localhost:5432/elevra_migration_test
      - run: alembic upgrade --sql head
        working-directory: services/backend
      - run: test "$(alembic heads | wc -l | tr -d ' ')" = 1
        working-directory: services/backend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r services/backend/requirements.txt
